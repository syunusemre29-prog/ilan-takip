name: ilan-takip

on:
  schedule:
    - cron: "0 */3 * * *"   # 3 saatte bir (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tara ve bildir
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python takip.py
      - name: Gorulen ilanlari kaydet
        run: |
          git config user.name "ilan-takip"
          git config user.email "ilan-takip@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "seen guncelle" && git push)
